name: Release GitHub npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: "0.0.1-alpha"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.26.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@coral-535"
          package-manager-cache: false

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Release version $version does not match package.json version $package_version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
            prerelease=true
          else
            npm_tag=latest
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            case "$goarch" in
              amd64) npm_arch=x64 ;;
              arm64) npm_arch=arm64 ;;
            esac

            output="bin/pum-${goos}-${npm_arch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$output" .
            chmod +x "$output"
          done

      - name: Verify npm package
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: npm publish --tag "$NPM_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
