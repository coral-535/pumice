name: Release GitHub npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: "0.0.1-alpha"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      git_tag: ${{ steps.release.outputs.git_tag }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Release version $version does not match package.json version $package_version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
            prerelease=true
          else
            npm_tag=latest
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    needs:
      - metadata
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            npm_arch: x64
          - goos: linux
            goarch: arm64
            npm_arch: arm64
          - goos: darwin
            goarch: amd64
            npm_arch: x64
          - goos: darwin
            goarch: arm64
            npm_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.metadata.outputs.version }}
          OUTPUT: pum-${{ matrix.goos }}-${{ matrix.npm_arch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$OUTPUT" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pum-${{ matrix.goos }}-${{ matrix.npm_arch }}
          path: pum-${{ matrix.goos }}-${{ matrix.npm_arch }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@coral-535"
          package-manager-cache: false

      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          pattern: pum-*
          path: bin
          merge-multiple: true

      - name: Prepare release binaries
        run: chmod +x bin/pum-*

      - name: Verify npm package
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
        run: npm publish --tag "$NPM_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.git_tag }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes bin/pum-*)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
