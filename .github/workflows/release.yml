name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Set version
        run: |
          version="${GITHUB_REF_NAME#v}"
          vp pm version "$version" -- --no-git-tag-version --allow-same-version

          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            npm_tag="${prerelease%%.*}"
            is_prerelease=true
          else
            npm_tag=latest
            is_prerelease=false
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NPM_TAG=$npm_tag" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$is_prerelease" >> "$GITHUB_ENV"

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack
        run: vp pack

      - name: Publish package
        run: vp pm publish --tag "$NPM_TAG" --provenance --no-git-checks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=("$GITHUB_REF_NAME" --verify-tag --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
